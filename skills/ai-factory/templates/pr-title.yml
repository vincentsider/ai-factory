name: PR title

# Pull request titles must be Conventional Commits ("feat(area): ...",
# "fix: ..."). With squash merging, the title becomes the commit on main and
# the line in the release notes. Required by the ruleset.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            build
            revert
          requireScope: false
