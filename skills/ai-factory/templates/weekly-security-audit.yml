name: Weekly security audit

# Once a week, an in-depth security review of the code that changed on main
# during the week, with Cloudflare's security-audit skill
# (.claude/skills/security-audit, installed by ai-factory at a fixed version).
# It is stricter than the nightly review: a problem only counts if it names
# who attacks, which protection they get past and what harm follows, and a
# separate agent must fail to disprove it. It reads the code only: it never
# runs the project's code, never contacts live sites.
# A confirmed problem of medium severity or worse opens an issue labelled
# "security". The full report is kept as a run artifact for 30 days.
# Cost: on the Claude subscription, capped by AUDIT_BUDGET agent calls.
# Nothing changed during the week: the job stops at once and costs nothing.

on:
  schedule:
    - cron: '0 2 * * 1' # Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'Review changes since (git date, e.g. "30 days ago")'
        required: false
        default: '7 days ago'

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUDIT_BUDGET: ${{ vars.AUDIT_BUDGET || '20' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Find what changed this week
        id: changes
        env:
          SINCE: ${{ github.event.inputs.since || '7 days ago' }}
        run: |
          BASE=$(git rev-list -1 --before="$SINCE" HEAD)
          if [ -z "$BASE" ]; then BASE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          COUNT=$(git diff --name-only --diff-filter=AMR "$BASE" HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.astro' '*.py' '*.go' '*.rb' '*.php' '*.java' '*.rs' '*.sql' \
            'wrangler.*' '*.toml' 'Dockerfile' '.github/workflows/*' \
            ':!**/__tests__/**' ':!**/*.test.*' ':!**/*.spec.*' ':!docs/**' | grep -c . || true)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed files since $SINCE: $COUNT"
          mkdir -p .security-audit
          grep -qx '.security-audit/' .gitignore 2>/dev/null || echo '.security-audit/' >> .gitignore

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.count != '0'
        with:
          node-version: 22

      - name: Security audit with Claude
        if: steps.changes.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the security-audit skill (.claude/skills/security-audit/SKILL.md) in FULL AUDIT MODE.
            This is the explicit audit request; do not ask questions, nobody can answer.

            - Target: this repository, ${{ github.repository }}, at HEAD of main.
            - Profile: quick.
            - Scoped run: the diff between ${{ steps.changes.outputs.base }} and HEAD
              (`git diff ${{ steps.changes.outputs.base }} HEAD`). Record everything else as out_of_scope.
            - Budget: at most ${{ env.AUDIT_BUDGET }} agent invocations in total. Apply the skill's budget gate.
            - Output directory: .security-audit/run-${{ github.run_number }} . The user explicitly selects this
              directory, and version control ignores it (.security-audit/ is in .gitignore).
            - Prior runs: none are available on this machine; say so in the coverage statement.
            - No OS-enforced sandbox is available on this runner: do NOT execute target code, builds or tests.
              Use source evidence only; anything that needs execution becomes needs_validation.
            - Validators: run `node .claude/skills/security-audit/validate-findings.cjs <output>/findings.json`
              and `node .claude/skills/security-audit/validate-coverage-ledger.cjs <output>/coverage-ledger.json`.

            When the report is written: if findings.json contains at least one record with status
            "confirmed" and severity medium, high or critical, create one issue:
            `gh issue create --label security --title "Weekly security audit <today's date>: <N> confirmed findings" --body-file <output>/REPORT.md`
            Never paste a secret value anywhere.
          claude_args: |
            --max-turns 250
            --allowedTools "Read,Glob,Grep,Task,Agent,Write(.security-audit/**),Edit(.security-audit/**),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git status:*),Bash(node .claude/skills/security-audit/validate-findings.cjs:*),Bash(node .claude/skills/security-audit/validate-coverage-ledger.cjs:*),Bash(gh issue create:*),Bash(gh issue list:*)"

      - name: Publish the report
        if: always() && steps.changes.outputs.count != '0'
        run: |
          R=".security-audit/run-${{ github.run_number }}"
          if [ -n "$R" ] && [ -f "$R/REPORT.md" ]; then
            cat "$R/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The audit finished without writing REPORT.md"
            echo "The audit wrote no report. Check the Claude step above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.count != '0'
        with:
          name: security-audit-${{ github.run_number }}
          path: .security-audit/
          if-no-files-found: ignore
          retention-days: 30
