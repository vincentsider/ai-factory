name: Tests

# The gate. Runs on every pull request into main and every push to main.
# The ONLY check the ruleset requires is the final job, "Test". It always
# reports, even when a part's job is skipped because its folder did not
# change, so unrelated pull requests are never blocked by a skipped check.
# If it is red: open the failed job, fix the cause in the same PR. Never
# weaken a check to make it pass.
#
# ADAPT: one job per deployable part (copy "app"), with its real check
# commands. Delete the "changes" filter if the repo has a single part.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # deploy-staging.yml reuses this gate

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed parts
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/tests.yml'

  app:
    name: App checks
    needs: changes
    # Always run on main, on manual runs and on reuse; skip only on PRs that did not touch it.
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check # typecheck, lint, build, tests (ADAPT to the stack)
      - name: Dependency audit (report only until the backlog is clear)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Leaked-key scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan new commits with gitleaks
        # Only the commits this push or PR adds. Old history is triaged once,
        # by hand, and live keys found there are rotated.
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            RANGE="-1 $HEAD_SHA"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          echo "Scanning: $RANGE"
          ./gitleaks git --no-banner --redact --log-opts="$RANGE" .

  test:
    name: Test
    needs: [app, secrets-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job ended with: $r"; exit 1 ;; esac
          done
