name: Tests

# The gate. Runs on every pull request into main and every push to main.
# The ONLY check the ruleset requires is the final job, "Test". It always
# reports, even when a part's job is skipped because its folder did not
# change, so unrelated pull requests are never blocked by a skipped check.
# If it is red: open the failed job, fix the cause in the same PR. Never
# weaken a check to make it pass.
#
# Every change comes with a test. Two checks watch it:
#   - "Tests added": a pull request that changes code without changing a test
#     gets flagged.
#   - coverage: the share of code covered by tests must not go down compared
#     with main (the reference is the share measured by the pull request that
#     produced main's latest commit).
# Both only warn at first. Repository variables TESTS_ADDED_MODE and
# COVERAGE_MODE set to "block" make them stop the change.
#
# ADAPT: one job per deployable part (copy "app"), with its real check
# commands. Delete the "changes" filter if the repo has a single part.

# Not on push to main: the ruleset only merges a branch that is up to date
# with main and green, with squash merges, so the commit that lands on main is
# exactly the code the pull request tested. Running it again after the merge
# only costs Actions minutes. A full run every night catches anything odd.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * *' # every night on main, full run
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to read the coverage reference (a run artifact)
  pull-requests: read # to find the pull request behind main's latest commit

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed parts
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/tests.yml'

  app:
    name: App checks
    needs: changes
    # Always run nightly and by hand; skip only on PRs that did not touch it
    # (a documentation-only PR skips it, and still gets the required Test).
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Keep installed packages between runs while the lockfile is unchanged
      # (saves most of the install time). ADAPT the path and key to the stack.
      - name: Reuse installed packages
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check # typecheck, lint, build, tests (ADAPT to the stack)
      # ADAPT: build exactly the way production builds (the Dockerfile or the
      # host's build command), then start it with no settings: a missing
      # module fails, a missing setting does not. Skip for a library.
      - name: Build like production and start it
        run: bash .github/scripts/start-check.sh "npm run build" "node dist/server.js" 25
      # ADAPT: run the tests with coverage and point COVERAGE_REPORT at the file
      # the tool writes (see coverage-check.py for the formats it reads).
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Coverage must not go down
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_MODE: ${{ vars.COVERAGE_MODE || 'warn' }}
          COVERAGE_REPORT: coverage/coverage-summary.json
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Reference = the share measured by the pull request that produced
            # main's current commit (this PR's base); else the last full run
            # on main (nightly).
            R="$GITHUB_REPOSITORY"; BASE="${{ github.event.pull_request.base.sha }}"; RUN=""
            PRN=$(gh api "repos/$R/commits/$BASE/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
            case "$PRN" in ''|*[!0-9]*) PRN="" ;; esac
            if [ -n "$PRN" ]; then
              REF=$(gh api "repos/$R/pulls/$PRN" --jq .head.ref)
              RUN=$(gh run list --repo "$R" --workflow tests.yml --branch "$REF" --event pull_request --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            fi
            if [ -n "$RUN" ]; then gh run download "$RUN" --repo "$R" --name coverage-reference --dir .coverage-ref || RUN=""; fi
            if [ -z "$RUN" ]; then
              RUN=$(gh run list --repo "$R" --workflow tests.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$RUN" ]; then gh run download "$RUN" --repo "$R" --name coverage-reference --dir .coverage-ref || true; fi
            fi
          fi
          python3 .github/scripts/coverage-check.py "$COVERAGE_REPORT" --baseline .coverage-ref/coverage.txt --write coverage.txt
      - name: Keep the coverage reference
        # Every full run keeps its share for the next pull request.
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reference
          path: coverage.txt
          retention-days: 90
      - name: Dependency audit (report only until the backlog is clear)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Leaked-key scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none # history without old file contents, fetched on demand
      - name: Scan new commits with gitleaks
        # Only the commits this push or PR adds. Old history is triaged once,
        # by hand, and live keys found there are rotated.
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            RANGE="-1 $HEAD_SHA"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          echo "Scanning: $RANGE"
          ./gitleaks git --no-banner --redact --log-opts="$RANGE" .

  tests-added:
    name: Tests added
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Code changes come with a test
        env:
          TESTS_ADDED_MODE: ${{ vars.TESTS_ADDED_MODE || 'warn' }}
          SKIP_TESTS_ADDED: ${{ contains(github.event.pull_request.labels.*.name, 'no-test-needed') }}
        run: bash .github/scripts/tests-added.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  test:
    name: Test
    needs: [app, secrets-scan, tests-added]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job ended with: $r"; exit 1 ;; esac
          done
