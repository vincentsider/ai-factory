name: Claude review

# An automatic code review on every pull request into main, posted as PR
# comments. Advice only: it never blocks a merge (the Test check does).
# Auth: one repository secret, CLAUDE_CODE_OAUTH_TOKEN (Claude subscription,
# from `claude setup-token`) or ANTHROPIC_API_KEY (pay per use).

on:
  pull_request:
    branches: [main]
    # Once per pull request, not on every push (saves most review minutes).
    # For a fresh review after fixes, add the label "review again".
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore: # no review for documentation-only pull requests
      - '**/*.md'
      - 'Docs/**'
      - 'docs/**'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and bot PRs (Dependabot PRs cannot read repository secrets).
    if: >-
      github.event.pull_request.draft == false && !endsWith(github.actor, '[bot]') &&
      (github.event.action != 'labeled' || github.event.label.name == 'review again')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          # History (without old file contents) so `git diff` can compare with main.
          fetch-depth: 0
          filter: blob:none
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first for the project rules.

            How to work (only these tools are allowed; anything else is refused):
            - See the change: `git diff origin/main...HEAD --stat`, then
              `git diff origin/main...HEAD -- <file>` per file, or `gh pr diff ${{ github.event.pull_request.number }}`.
              Open files with the Read tool. Search with Grep and Glob.
            - Run ONE simple command per call: no pipes (|), no &&, no ;, no $( ),
              no heredocs, no redirections, no --output. A combined command is refused.
            - Inline comments: the inline comment tool.
            - The summary: post it in ONE command, the text in single quotes:
              gh pr comment ${{ github.event.pull_request.number }} --body 'your summary'
              (no $( ), no file). Inside the text, avoid single quotes.
              Always post a summary, even when everything looks good.

            Focus, in this order:
            1. Bugs: logic errors, missed edge cases, broken error handling.
            2. Security: auth and permission checks, input validation, secrets in code,
               injection, unsafe data access.
            3. The project rules in CLAUDE.md.
            4. Tests: changed behaviour without a test that proves it, a test deleted or
               weakened (assertions removed, skipped, loosened) to make the gate pass.

            Only report real, specific problems, with file and line. Skip style
            nitpicks. Use inline comments for specific issues and one short summary
            comment. Write in plain language. If the change looks good, say so in one line.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep"
