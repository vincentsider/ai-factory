name: Claude review

# An automatic code review on every pull request into main, posted as PR
# comments. Advice only: it never blocks a merge (the Test check does).
# Auth: one repository secret, CLAUDE_CODE_OAUTH_TOKEN (Claude subscription,
# from `claude setup-token`) or ANTHROPIC_API_KEY (pay per use).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and bot PRs (Dependabot PRs cannot read repository secrets).
    if: github.event.pull_request.draft == false && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first for the project rules.
            Look at the diff with `gh pr diff`, and open files as needed for context.

            Focus, in this order:
            1. Bugs: logic errors, missed edge cases, broken error handling.
            2. Security: auth and permission checks, input validation, secrets in code,
               injection, unsafe data access.
            3. The project rules in CLAUDE.md.
            4. Missing tests for changed behaviour.

            Only report real, specific problems, with file and line. Skip style
            nitpicks. Use inline comments for specific issues and one short summary
            comment. Write in plain language. If the change looks good, say so in one line.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
